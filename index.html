enestar y en tu estilo de vida.'],['Envía tu solicitud','Cuéntanos un poco sobre ti y tu hogar.'],['Conversamos contigo','Resolvemos dudas y preparamos el encuentro.'],['Conoce a tu nuevo compañero','Comienza una historia, con nuestro apoyo.']].map(([t,p],i)=>`<div><div class="process-number">0${i+1}</div><h3>${t}</h3><p>${p}</p></div>`).join('')}</div></div></section><section class="section"><div class="wrap"><div class="section-head"><div><div class="eyebrow">Más que encontrar un hogar</div><h2>Cuidamos cada nuevo comienzo</h2></div><p>Somos un refugio construido alrededor de una idea sencilla: cada vida merece cuidado, respeto y una familia.</p></div><div class="grid four">${[['heart','Rescatamos historias','Damos cuidado y tiempo a animales que necesitan una segunda oportunidad.'],['shield','Salud y bienestar','Evaluación veterinaria y orientación sobre sus necesidades de salud.'],['file','Proceso transparente','Conoce cada etapa, lo que esperamos y cómo prepararte.'],['user','Nunca estás a solas','Te orientamos en la adaptación y el cuidado de tu compañero.']].map(([i,t,p])=>`<div class="trust-card">${icon(i)}<h3>${t}</h3><p>${p}</p></div>`).join('')}</div></div></section><section class="wrap" style="padding-bottom:40px"><div class="cta"><div><h2>Un nuevo comienzo puede empezar hoy.</h2><p>Tu próximo gran amigo está más cerca de lo que imaginas.</p></div>${link('/mascotas','Ver mascotas disponibles','btn','arrow')}</div></section>`}
function field(name,label,value='',type='text',required=true){return `<div class="field"><label for="f-${name}">${label}${required?' <span aria-hidden="true">*</span>':''}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='email'?'autocomplete="email"':type==='tel'?'autocomplete="tel"':''} maxlength="${type==='email'?150:120}"></div>`}
function select(name,label,options,value='',required=false){return `<div class="field"><label for="f-${name}">${label}${required?' *':''}</label><select id="f-${name}" name="${name}" ${required?'required':''}>${options.map(o=>{let [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`}).join('')}</select></div>`}
function textArea(name,label,value='',required=false){return `<div class="field"><label for="f-${name}">${label}${required?' *':''}</label><textarea id="f-${name}" name="${name}" ${required?'required':''} maxlength="2000">${esc(value)}</textarea></div>`}
function pageTop(title,desc='',crumb=''){return `<div class="page-top">${crumb?`<div class="breadcrumbs">${link('/','Inicio','')} / ${crumb}</div>`:''}<h1>${title}</h1>${desc?`<p>${desc}</p>`:''}</div>`}
function catalog(){return `<div class="wrap">${pageTop('Tu compañero está por aquí','No buscas una mascota perfecta. Buscas ese encuentro que se siente como hogar.','Mascotas')}<div class="catalog-layout"><aside class="panel filters" aria-label="Filtros de mascotas"><h2>${icon('search')} Encuentra tu compañía</h2><div class="field search-box"><label for="pet-search">Buscar por nombre o raza</label><input id="pet-search" type="search" placeholder="Ej. Canela" value="${esc(filters.q)}" autocomplete="off"></div><div class="filter-fields">${select('species','Especie',[['','Todas'],'Perro','Gato'],filters.species)}${select('size','Tamaño',[['','Todos'],'Pequeño','Mediano','Grande'],filters.size)}${select('age','Edad',[['','Todas'],['young','Menos de 1 año'],['adult','De 1 a 6 años'],['senior','7 años o más']],filters.age)}${select('status','Estado',[['','Todos'],'Disponible','En proceso','Adoptado'],filters.status)}</div>${btn('Limpiar filtros','clear','btn ghost full')}<p class="small muted" style="margin-top:16px">Elegir con calma también es una forma de cuidar.</p></aside><div><div class="catalog-toolbar"><p id="result-count" role="status" aria-live="polite"></p><div class="row"><label class="small" for="sort">Ordenar</label><select id="sort"><option value="name" ${filters.order==='name'?'selected':''}>Nombre: A–Z</option><option value="young" ${filters.order==='young'?'selected':''}>Menor edad</option><option value="old" ${filters.order==='old'?'selected':''}>Mayor edad</option></select></div></div><div id="catalog-results"></div><details class="demo-tools"><summary>Probar estados del prototipo</summary><div class="row">${btn('Loading','loading','btn secondary small')}${btn('Error','error','btn secondary small')}${btn('Sin resultados','empty','btn secondary small')}${btn('Resultados','clear','btn secondary small')}</div></details></div></div><div class="notice" style="margin:32px 0">${icon('info')}<p>Las historias, estados y fotografías son ilustrativos. Las solicitudes de este prototipo no se envían al refugio.</p></div></div>`}
function filteredPets(){let q=filters.q.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();return pets.filter(p=>`${p.name} ${p.breed}`.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(q)&&(!filters.species||p.species===filters.species)&&(!filters.size||p.size===filters.size)&&(!filters.status||p.status===filters.status)&&(!filters.age||(filters.age==='young'?p.age<1:filters.age==='adult'?p.age>=1&&p.age<7:p.age>=7))).sort((a,b)=>filters.order==='young'?a.age-b.age:filters.order==='old'?b.age-a.age:a.name.localeCompare(b.name,'es'))}
function renderResults(){let box=$('#catalog-results');if(!box)return;let list=filteredPets();$('#result-count').textContent=catalogMode==='results'?`${list.length} ${list.length===1?'compañero encontrado':'compañeros encontrados'}`:'';if(catalogMode==='loading'){box.innerHTML='<div class="catalog-state" role="status"><div class="spinner"></div><h2>Cargando mascotas...</h2><p>Estamos preparando sus historias.</p></div>';return}if(catalogMode==='error'){box.innerHTML=`<div class="catalog-state" role="alert">${icon('info')}<h2>No pudimos cargar la información.</h2><p>Es un error simulado. Puedes intentarlo otra vez.</p>${btn('Intentar nuevamente','retry')}</div>`;return}box.innerHTML=list.length?`<div class="catalog-grid">${list.map(petCard).join('')}</div>`:`<div class="catalog-state">${icon('search')}<h2>No encontramos mascotas con esos filtros.</h2><p>Prueba con otra especie, tamaño o nombre.</p>${btn('Limpiar filtros','clear')}</div>`;bindImages()}
function detail(p){if(!p)return notFound();return `<div class="wrap section"><div class="breadcrumbs">${link('/mascotas','Mascotas','')} / ${esc(p.name)}</div><div class="detail-grid"><div>${image(p,'main-pet',false)}<div class="thumbnails" aria-label="Vistas de la fotografía">${['center center','center top','center bottom'].map((pos,i)=>`<button type="button" data-action="thumbnail" data-pos="${pos}" aria-label="${['Vista completa','Encuadre superior','Encuadre inferior'][i]} de ${esc(p.name)}" aria-pressed="${i===0}">${image(p)}</button>`).join('')}</div><p class="small muted" style="margin-top:12px">Fotografía ilustrativa · Miniaturas de encuadre.</p></div><div class="detail-copy">${badge(p.status)}<h1>Hola, soy ${esc(p.name)}.</h1><p>${esc(p.description)}</p><dl class="facts">${[['Especie',p.species],['Raza',p.breed],['Edad',ageText(p)],['Tamaño',p.size],['Sexo',p.sex],['Peso',p.weight+' kg']].map(([t,v])=>`<div><dt>${t}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl><h3>Así soy yo</h3><div class="chips">${p.temperament.split(',').map(t=>`<span class="chip">${esc(t.trim())}</span>`).join('')}</div>${p.status==='Disponible'?btn('Solicitar adopción '+icon('arrow'),'adopt','btn full',`data-id="${p.id}"`):`<button class="btn full" disabled>${p.status==='En proceso'?'Adopción en proceso':'Ya encontró un hogar'}</button>`}<p class="small muted center" style="margin-top:12px">El primer paso de una gran historia. Sin compromiso.</p></div></div><div class="grid three detail-lower"><div class="panel">${icon('shield')}<h3 style="margin-top:12px">Mi salud</h3><p>${esc(p.health)}</p></div><div class="panel">${icon('user')}<h3 style="margin-top:12px">Con niños</h3><p>${esc(p.children)}</p></div><div class="panel">${icon('paw')}<h3 style="margin-top:12px">Con otros animales</h3><p>${esc(p.animals)}</p></div></div></div>`}
function adoption(){if(successId)return `<div class="wrap section"><div class="panel form-shell center" style="padding:48px 28px"><div class="success-mark">${icon('check')}</div><div class="eyebrow">Un paso más cerca</div><h1 style="font-size:2rem">Solicitud enviada correctamente.</h1><p style="margin:18px 0 24px">Tu solicitud de prueba <strong>${esc(successId)}</strong> para ${esc(petName(selectedPet))} está lista.<br>No se ha enviado información ni correo real.</p><div class="row" style="justify-content:center">${link('/mi-solicitud','Ver mi solicitud','btn','arrow')}${btn('Volver al catálogo','new-request','btn secondary')}</div></div></div>`;let p=getPet(selectedPet);if(!p||p.status!=='Disponible')return `<div class="wrap section"><div class="panel center stack"><h1 style="font-size:2rem">Elige una mascota disponible</h1><p>Antes de comenzar, encuentra a tu compañero en el catálogo.</p>${link('/mascotas','Ver mascotas')}</div></div>`;let content=step===1?`<div class="grid two">${field('first','Nombre',draft.first||'')}${field('last','Apellido',draft.last||'')}${field('email','Correo electrónico',draft.email||'','email')}${field('phone','Teléfono',draft.phone||'','tel')}</div>`:step===2?`<div class="grid two">${select('house','Tipo de vivienda',[['','Selecciona'],'Casa','Apartamento','Finca'],draft.house||'',true)}${field('city','Ciudad',draft.city||'')}${select('yard','¿Tiene patio?',[['','Selecciona'],'Sí','No'],draft.yard||'',true)}${select('people','¿Vive con otras personas?',[['','Selecciona'],'Sí','No'],draft.people||'',true)}${select('pets','¿Tiene otras mascotas?',[['','Selecciona'],'Sí','No'],draft.pets||'',true)}</div>`:step===3?`${textArea('experience','Experiencia con animales',draft.experience||'',true)}${textArea('motivation','Motivo de adopción',draft.motivation||'',true)}${textArea('comments','Comentarios adicionales',draft.comments||'')}`:`<p>Revisa tus datos antes de confirmar.</p>${summary([['Mascota',p.name],['Nombre',`${draft.first} ${draft.last}`],['Correo',draft.email],['Teléfono',draft.phone],['Vivienda',draft.house],['Ciudad',draft.city],['Patio',draft.yard],['Otras personas',draft.people],['Otras mascotas',draft.pets],['Experiencia',draft.experience],['Motivación',draft.motivation],['Comentarios',draft.comments||'Sin comentarios']])}<label class="check"><input type="checkbox" name="accepted" required> Acepto que la información proporcionada es correcta.</label>`;return `<div class="wrap section"><div class="form-shell"><div class="breadcrumbs">${link('/mascotas/'+p.id,p.name,'')} / Solicitud de adopción</div><h1 style="font-size:2.4rem">Un hogar para ${esc(p.name)}</h1><p style="margin-top:12px">Cuéntanos sobre ti. Los campos con * son obligatorios.</p><ol class="stepper" aria-label="Progreso del formulario">${['Información personal','Tu hogar','Experiencia y motivación','Confirmación'].map((t,i)=>`<li class="${i+1===step?'active':i+1<step?'done':''}" ${i+1===step?'aria-current="step"':''}>${i+1}. ${t}</li>`).join('')}</ol><div class="panel"><h2 style="font-size:1.4rem;margin-bottom:24px">${['Información personal','Información del hogar','Experiencia y motivación','Todo listo para confirmar'][step-1]}</h2><form id="adoption-form">${content}<div class="form-actions">${step>1?btn(icon('back')+' Atrás','previous','btn secondary'):link('/mascotas/'+p.id,'Cancelar','btn ghost')}<button class="btn" type="submit">${step===4?'Enviar solicitud':'Continuar'} ${icon('arrow')}</button></div></form></div><div class="notice" style="margin-top:22px">${icon('shield')}<p>Modo demostración. Usa datos ficticios. El formulario solo vive en esta pestaña y no se envía a ningún servidor.</p></div></div></div>`}
function summary(items){return `<dl class="summary-list">${items.map(([t,v])=>`<div><dt>${esc(t)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`}
function timeline(r){let sequence=['Nueva','En revisión','Entrevista','Visita al hogar','Aprobada','Finalizada'];let index=sequence.indexOf(r.status);if(r.status==='Rechazada')return `<div class="notice" style="background:var(--red-bg);margin-top:24px">${icon('info')}<p><strong>Solicitud rechazada</strong><br>El proceso se ha cerrado. Puedes conversar con el equipo sobre los motivos en un caso real.</p></div>`;return `<ol class="timeline">${sequence.map((s,i)=>`<li class="${i<index?'done':i===index?'current':''}" ${i===index?'aria-current="step"':''}><span class="dot">${i<index?icon('check'):i+1}</span><div><h3>${s}</h3><p>${i<index?'Etapa completada':i===index?'Estado actual':'Próxima etapa'}</p></div></li>`).join('')}</ol>`}
function tracking(){let r=requests.find(x=>x.id===trackId)||requests[0];if(!r)return `<div class="wrap section center stack"><h1>No tienes solicitudes</h1>${link('/mascotas','Conocer mascotas')}</div>`;return `<div class="wrap">${pageTop('Cada paso nos acerca','Aquí puedes seguir el camino hacia un nuevo comienzo.','Mi solicitud')}<div class="grid two"><section class="panel"><div class="row between"><h2 style="font-size:1.4rem">Mi solicitud</h2>${badge(r.status)}</div>${summary([['Número',r.id],['Mascota',petName(r.pet)],['Fecha',formatDate(r.date)],['Responsable',r.owner]])}<div class="notice">${icon('clock')}<p><strong>Próxima actividad</strong><br>${esc(r.next)}</p></div><div class="row" style="margin-top:24px">${getPet(r.pet)?link('/mascotas/'+r.pet,'Ver mascota','btn secondary'):''}${!['Finalizada','Rechazada'].includes(r.status)?btn('Cancelar solicitud','cancel-request','btn ghost',`data-id="${r.id}"`):''}</div></section><section class="panel"><h2 style="font-size:1.4rem">Tu proceso de adopción</h2>${timeline(r)}</section></div><div class="notice" style="margin:24px 0 40px">${icon('info')}<p>Seguimiento simulado. Los cambios administrativos se reflejan aquí durante esta sesión; se reinician al recargar.</p></div></div>`}
const faqs=[['¿Cuáles son los requisitos para adoptar?','En este refugio de ejemplo, pedimos ser mayor de edad, contar con un hogar seguro, tiempo para acompañar al animal y el compromiso de cubrir su cuidado. Evaluamos cada caso de forma individual.'],['¿Cuánto dura el proceso?','Como referencia ilustrativa, entre una y dos semanas. Depende de las conversaciones, las visitas y las necesidades de la mascota. No hay un plazo garantizado.'],['¿La adopción tiene algún costo?','Este prototipo no cobra ni procesa pagos. En un refugio real, consulta directamente si existe un aporte de recuperación y qué cuidados incluye.'],['¿Qué documentos necesito?','En una etapa real podrían solicitar identificación y un compromiso de adopción. Este prototipo no solicita ni almacena documentos.'],['¿Puedo adoptar si vivo en un apartamento?','Sí. Lo importante es elegir una mascota compatible con tu espacio y rutina, ofrecer actividad adecuada y asegurar balcones y ventanas.'],['¿Puedo adoptar si tengo niños?','Sí. Te orientaremos sobre compatibilidad, supervisión adulta y una adaptación respetuosa tanto para los niños como para la mascota.'],['¿Qué pasa si ya tengo otras mascotas?','Lo conversaremos antes de avanzar. Las presentaciones graduales y supervisadas ayudan a comprobar la compatibilidad y reducir el estrés.'],['¿Puedo visitar a las mascotas antes de adoptar?','La visita es parte del proceso responsable. En un caso real se coordina previamente; aquí solo puedes simular una solicitud.'],['¿Ofrecen seguimiento después de la adopción?','El acompañamiento forma parte de la experiencia diseñada: orientación sobre adaptación, hábitos y bienestar. No hay comunicaciones reales en esta versión.'],['¿Puedo cancelar mi solicitud?','Sí. En Mi solicitud puedes abrir la opción de cancelar. Se te pedirá confirmación y, en este prototipo, el registro se cerrará solo de forma local.']];
function faq(){return `<div class="wrap section"><div class="faq-wrap"><div class="eyebrow">Estamos para ayudarte</div><h1 style="font-size:2.6rem">Pequeñas dudas,<br>respuestas importantes.</h1><p style="margin:20px 0 28px">Todo lo que necesitas saber antes de dar el siguiente paso.</p><div class="field"><label for="faq-search">Buscar en preguntas frecuentes</label><input type="search" id="faq-search" placeholder="Escribe: requisitos, costos, niños..."></div><p id="faq-count" class="small muted" role="status"></p><div id="faq-list">${faqItems(faqs)}</div><div class="notice" style="margin-top:28px">${icon('heart')}<p>Adoptar es una decisión para toda la vida. Tómate el tiempo que necesites.</p></div></div></div>`}
function faqItems(list){return list.length?list.map(([q,a])=>`<details class="faq-item"><summary>${q}</summary><p>${a}</p></details>`).join(''):`<div class="catalog-state"><h2>No encontramos esa pregunta.</h2>${btn('Limpiar búsqueda','clear-faq','btn secondary')}</div>`}
function password(){return `<div class="field"><label for="password">Contraseña de prueba *</label><div class="input-wrap"><input id="password" type="password" name="password" minlength="4" required autocomplete="off" placeholder="Cualquier texto de 4 o más caracteres"><button class="icon-btn" type="button" data-action="password" aria-label="Mostrar contraseña" aria-pressed="false">${icon('eye')}</button></div></div>`}
function login(admin=false){let form=`${field('email','Correo electrónico','', 'email')}${password()}<div class="row between" style="margin:6px 0 24px">${admin?'<span class="small muted">Acceso de demostración</span>':'<label class="check"><input name="remember" type="checkbox"> Recordar sesión</label>'+btn('Recuperar contraseña','recover','btn ghost small')}<button class="btn full" type="submit">${admin?'Entrar al panel':'Iniciar sesión'} ${icon('arrow')}</button></div>`;if(admin)return `<div class="login-admin"><div class="panel">${brand()}<h1>Un lugar para cuidar cada detalle.</h1><p style="margin-top:14px">Acceso al equipo de administración.</p><form id="admin-login">${form}</form><div class="notice">${icon('info')}<p>Login simulado. Usa cualquier correo válido y una contraseña inventada de al menos 4 caracteres. No existe control de acceso real.</p></div><div style="margin-top:18px">${link('/','Volver al portal','btn ghost')}</div></div></div>`;return `<div class="wrap"><div class="auth"><div class="auth-art">${image(pets.find(p=>p.id==='nube')||heroPet,'',false)}<div class="auth-quote"><div class="eyebrow">Aquí empieza una nueva historia</div><h2>Un hogar es mejor<br>cuando se comparte.</h2><p>Conecta con tu próximo compañero.</p></div></div><div class="auth-form"><div class="eyebrow">Qué bueno verte de nuevo</div><h1>Bienvenido a Esperanza</h1><p>Tu próxima gran amistad empieza aquí.</p><form id="public-login">${form}</form><p class="small">¿Es tu primera visita? ${btn('Crear cuenta','register','btn ghost small')}</p><div class="notice">${icon('info')}<p>Acceso de prueba: cualquier correo válido y una contraseña inventada de 4 o más caracteres. No uses credenciales reales.</p></div></div></div></div>`}
function profilePage(){return `<div class="wrap">${pageTop('Tu espacio en Esperanza','Un hogar comienza con personas que quieren cuidar.','Mi perfil')}<div class="row between panel" style="margin-bottom:24px"><div class="row"><div class="avatar">${esc(profile.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</div><div><h2 style="font-size:1.4rem">${esc(profile.name)}</h2><p class="small">Perfil de demostración · Adoptante</p></div></div>${btn('Cerrar sesión','logout','btn secondary')}</div><div class="grid two"><section class="panel"><div class="row between"><h2 style="font-size:1.4rem">Información personal</h2>${btn(icon('edit')+' Editar','edit-profile','btn ghost small')}</div>${summary([['Nombre',profile.name],['Correo',profile.email],['Teléfono',profile.phone]])}<h3 style="margin-top:20px">Mi hogar</h3>${summary([['Vivienda',profile.house],['Ciudad',profile.city],['Otras mascotas',profile.others]])}</section><section class="panel"><h2 style="font-size:1.4rem">Mis solicitudes</h2>${requests.filter(r=>r.id===trackId||r.email===profile.email).map(r=>`<div class="activity"><div style="flex:1"><div class="row between"><strong>${esc(petName(r.pet))}</strong>${badge(r.status)}</div><p>${r.id} · ${formatDate(r.date)}</p>${btn('Ver seguimiento '+icon('arrow'),'track','btn ghost small',`data-id="${r.id}"`)}</div></div>`).join('')||'<p style="margin-top:24px">Todavía no tienes solicitudes.</p>'}${link('/mascotas','Conocer más compañeros','btn secondary full')}</section></div><p class="small muted" style="margin:24px 0 40px">Los cambios de perfil permanecen en esta pestaña hasta que recargues el archivo.</p></div>`}
const adminNav=[['dashboard','Resumen','grid'],['mascotas','Mascotas','paw'],['solicitudes','Solicitudes','file'],['usuarios','Usuarios','user'],['reportes','Reportes','chart'],['configuracion','Configuración','settings']];
function adminShell(content){return `<div class="admin-shell">${drawerOpen?'<button class="drawer-scrim" data-action="drawer" aria-label="Cerrar navegación"></button>':''}<aside class="sidebar ${drawerOpen?'open':''}">${brand()}<div class="demo-tag" style="color:#bdced9">Administración · Demo</div><nav id="admin-nav" aria-label="Administración">${adminNav.map(([r,t,i])=>`<a href="#/admin/${r}" ${route.includes('/admin/'+r)?'aria-current="page"':''}>${icon(i)}${t}</a>`).join('')}</nav><div class="sidebar-footer">Un equipo. Muchas segundas oportunidades.${btn(icon('logout')+' Cerrar sesión','admin-logout','btn ghost')}</div></aside><div class="admin-main"><header class="admin-header"><span class="small muted">Refugio Esperanza <span aria-hidden="true">/</span> Equipo</span><div class="row"><span class="badge blue">Entorno de prueba</span><span class="admin-name small">Camila · Administrador</span>${controls(true)}</div></header><main id="main" tabindex="-1" class="admin-content">${content}</main></div></div>`}

const pending=()=>requests.filter(r=>!['Aprobada','Rechazada','Finalizada'].includes(r.status)).length;
function metrics(){return `<div class="grid four">${[['Disponibles',pets.filter(p=>p.status==='Disponible').length,'paw','Listos para un hogar'],['En proceso',pets.filter(p=>p.status==='En proceso').length,'clock','Conociendo a su familia'],['Adoptadas',pets.filter(p=>p.status==='Adoptado').length,'heart','Un nuevo comienzo'],['Solicitudes pendientes',pending(),'file','Para revisar y acompañar']].map(([t,n,i,d])=>`<div class="metric"><div class="row between"><span class="label">${t}</span>${icon(i)}</div><div class="num">${n}</div><p>${d}</p></div>`).join('')}</div>`}
function dashboard(){return adminHeading('Hola, equipo Esperanza.','Cada pequeña acción acerca a alguien a su nuevo hogar.',link('/admin/mascotas/nueva',icon('plus')+' Nueva mascota'))+metrics()+`<div class="grid two admin-panels"><section class="panel"><div class="row between"><h2 style="font-size:1.3rem">Actividad reciente</h2><span class="small muted">Datos de ejemplo</span></div>${requests.slice(0,3).map(r=>`<div class="activity">${icon('file')}<div><strong>${esc(r.name)}</strong><p>Solicitud para ${esc(petName(r.pet))} · ${esc(r.status)}</p><small>${formatDate(r.updated)}</small></div></div>`).join('')}</section><section class="panel stack"><h2 style="font-size:1.3rem">Acciones rápidas</h2>${link('/admin/solicitudes',icon('file')+' Ver solicitudes','btn secondary full')}${link('/admin/mascotas',icon('paw')+' Gestionar mascotas','btn secondary full')}<div class="notice">${icon('bell')}<p><strong>Notificaciones de ejemplo</strong><br>${pending()} solicitudes pendientes de acompañamiento.<br>Revisar las fotografías y fichas de las nuevas mascotas.</p></div></section></div>`}
function table(headers,rows){return `<div class="table-scroll"><table class="responsive-table"><thead><tr>${headers.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(row=>`<tr>${row.map((cell,i)=>`<td data-label="${headers[i]}">${cell}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}">No hay registros que mostrar.</td></tr>`}</tbody></table></div>`}
function actionIcon(ic,a,label,id){return btn(icon(ic),a,'icon-btn',`aria-label="${esc(label)}" title="${esc(label)}" data-id="${esc(id)}"`)}
function adminPets(){return adminHeading('Mascotas','Historias que necesitan cuidado, visibilidad y una familia.',link('/admin/mascotas/nueva',icon('plus')+' Nueva mascota'))+`<div class="table-panel"><div class="table-tools"><strong>${pets.length} mascotas</strong><label class="sr-only" for="admin-search">Buscar mascota</label><input id="admin-search" type="search" placeholder="Buscar por nombre o raza"></div><div id="admin-pet-table">${petTable(pets)}</div></div>`}
function petTable(list){return table(['Foto','Nombre','Especie / Raza','Edad','Tamaño','Estado','Acciones'],list.map(p=>[image(p),`<strong>${esc(p.name)}</strong>`,`${esc(p.species)}<br><span class="muted">${esc(p.breed)}</span>`,ageText(p),esc(p.size),badge(p.status),`<div class="actions">${actionIcon('eye','admin-view','Ver '+p.name,p.id)}<a class="icon-btn" href="#/admin/mascotas/${p.id}/editar" aria-label="Editar ${esc(p.name)}" title="Editar">${icon('edit')}</a>${actionIcon('image','photos','Fotografías de '+p.name,p.id)}${actionIcon('clock','pet-status','Cambiar estado de '+p.name,p.id)}${actionIcon('trash','delete-pet','Eliminar '+p.name,p.id)}</div>`]))}
function petForm(p=null){return adminHeading(p?'Editar a '+esc(p.name):'Una nueva historia','Los campos con * son obligatorios. Cambios solo en esta sesión.',link('/admin/mascotas','Volver al listado','btn secondary'))+`<form id="pet-form" data-id="${p?.id||''}"><div class="grid two"><section class="panel"><h2 style="font-size:1.3rem;margin-bottom:24px">Información básica</h2><div class="grid two">${field('name','Nombre',p?.name||'')}${select('species','Especie',['Perro','Gato'],p?.species||'Perro',true)}${field('breed','Raza',p?.breed||'')}${field('age','Edad en años',p?.age??'','number')}${select('size','Tamaño',['Pequeño','Mediano','Grande'],p?.size||'Mediano',true)}${select('sex','Sexo',['Hembra','Macho'],p?.sex||'Hembra',true)}${field('weight','Peso en kg',p?.weight??'','number')}${select('status','Estado',['Disponible','En proceso','Adoptado'],p?.status||'Disponible',true)}</div>${textArea('description','Descripción',p?.description||'',true)}${field('temperament','Temperamento (separado por comas)',p?.temperament||'')}</section><section class="panel"><h2 style="font-size:1.3rem;margin-bottom:24px">Bienestar y fotografías</h2>${textArea('health','Información de salud',p?.health||'',true)}${field('children','Compatibilidad con niños',p?.children||'Por evaluar')}${field('animals','Compatibilidad con otros animales',p?.animals||'Por evaluar')}<h3>Fotografía principal</h3><div class="photo-edit" id="pet-form-photos">${image(p||pets[0]||{image:photo('photo-1552053831-71594a27632d'),name:'Ejemplo',species:'Perro',breed:'Golden retriever'})}${btn(icon('plus')+' Agregar fotografía','mock-photo','btn secondary')}</div><p class="small muted">Imagen de ejemplo. La carga de archivos se simula; no se suben fotografías.</p></section></div><div class="form-actions">${link('/admin/mascotas','Cancelar','btn secondary')}<button class="btn" type="submit">${icon('check')} Guardar mascota</button></div></form>`}
function adminRequests(){return adminHeading('Solicitudes de adopción','Acompaña cada historia, desde el primer encuentro hasta el nuevo hogar.')+`<div class="table-panel"><div class="table-tools"><strong>${requests.length} solicitudes</strong><div class="row"><label for="request-filter" class="small">Estado</label><select id="request-filter"><option value="">Todos los estados</option>${stages.map(s=>`<option>${s}</option>`).join('')}</select></div></div><div id="requests-table">${requestTable(requests)}</div></div>`}
function requestTable(list){return table(['Solicitante','Mascota','Fecha','Estado','Responsable','Actualización','Detalle'],list.map(r=>[`<strong>${esc(r.name)}</strong><br><span class="muted">${r.id}</span>`,esc(petName(r.pet)),formatDate(r.date),badge(r.status),esc(r.owner),formatDate(r.updated),link('/admin/solicitudes/'+r.id,'Ver solicitud','btn secondary small')]))}
function requestDetail(r){if(!r)return notFound();return adminHeading(r.id,'Una historia que estamos acompañando.',link('/admin/solicitudes','Volver a solicitudes','btn secondary'))+`<div class="grid two"><section class="panel"><h2 style="font-size:1.35rem">Información del solicitante</h2>${summary([['Nombre',r.name],['Correo',r.email],['Teléfono',r.phone],['Ciudad',r.city],['Vivienda',r.house],['Otras mascotas',r.others],['Mascota',petName(r.pet)],['Responsable',r.owner]])}<form id="request-form" data-id="${r.id}">${select('status','Estado de la solicitud',stages,r.status)}${field('owner','Responsable',r.owner)}${textArea('notes','Observaciones internas',r.notes)}<button type="submit" class="btn">Guardar cambios</button></form></section><section class="panel"><h2 style="font-size:1.35rem">Historial</h2>${r.history.map(([d,t])=>`<div class="activity">${icon('clock')}<div><strong>${esc(t)}</strong><p>${esc(d)}</p></div></div>`).join('')}<div class="notice" style="margin-top:24px">${icon('info')}<p>Estos controles actualizan el estado local y el seguimiento público. No envían notificaciones reales.</p></div></section></div>`}
function adminUsers(){return adminHeading('Usuarios','Personas que hacen posibles los nuevos comienzos.')+`<div class="table-panel">${table(['Nombre','Correo','Estado','Tipo','Solicitudes','Acciones'],users.map(u=>[`<strong>${esc(u.name)}</strong>`,esc(u.email),badge(u.status),esc(u.type),u.requests,`<div class="actions">${actionIcon('eye','view-user','Ver a '+u.name,u.id)}${actionIcon('edit','edit-user','Editar a '+u.name,u.id)}${btn(u.status==='Activo'?'Desactivar':'Activar','toggle-user','btn secondary small',`data-id="${u.id}"`)}</div>`]))}</div>`}
function report(){let distribution=stages.map(s=>[s,requests.filter(r=>r.status===s).length]);return adminHeading('El impacto de cada oportunidad','Vista ilustrativa calculada con los registros de esta sesión.')+metrics()+`<div class="grid two admin-panels"><section class="panel"><h2 style="font-size:1.3rem">Solicitudes por estado</h2><p class="small" style="margin-top:8px">Distribución actual · ${requests.length} solicitudes</p><div class="stat-bars">${distribution.map(([t,n])=>`<div class="bar-row"><div class="row between"><span>${t}</span><strong>${n}</strong></div><div class="bar-track" aria-hidden="true"><div class="bar-fill" style="width:${requests.length?n/requests.length*100:0}%"></div></div></div>`).join('')}</div></section><section class="panel"><h2 style="font-size:1.3rem;margin-bottom:24px">Resumen de mascotas</h2>${table(['Estado','Total','Proporción'],['Disponible','En proceso','Adoptado'].map(s=>{let n=pets.filter(p=>p.status===s).length;return [badge(s),n,`${pets.length?Math.round(n/pets.length*100):0}%`]}))}<div class="notice" style="margin-top:24px">${icon('info')}<p>Datos de demostración, no cifras reales del refugio. El resumen refleja los cambios de mascotas y solicitudes realizados en esta pestaña.</p></div></section></div>`}
function configuration(){return adminHeading('Configuración','Preferencias simples para un equipo que cuida.')+`<form id="settings-form" class="grid two"><section class="panel"><h2 style="font-size:1.3rem;margin-bottom:24px">General</h2>${field('name','Nombre del refugio',settings.name)}${field('email','Correo de contacto',settings.email,'email')}${field('phone','Teléfono',settings.phone,'tel')}<p class="small muted">Información de ejemplo. Editarla no cambia la identidad del portal público.</p><button class="btn" type="submit" style="margin-top:24px">Guardar configuración</button></section><section class="panel"><h2 style="font-size:1.3rem">Preferencias</h2><div class="settings-row"><div><label for="notifications"><strong>Notificaciones</strong></label><p>Activar avisos simulados del panel.</p></div><input type="checkbox" id="notifications" name="notifications" ${settings.notifications?'checked':''}></div><div class="settings-row"><div><label for="setting-theme"><strong>Apariencia</strong></label><p>Se guarda en este navegador.</p></div><select id="setting-theme"><option value="light" ${document.documentElement.dataset.theme==='light'?'selected':''}>Tema claro</option><option value="dark" ${document.documentElement.dataset.theme==='dark'?'selected':''}>Tema oscuro</option></select></div><div class="notice" style="margin-top:24px">${icon('shield')}<p>Prototipo local: no hay permisos reales, correos, pagos ni servicios externos de datos.</p></div></section></form>`}
function notFound(){return `<div class="not-found stack"><div class="eyebrow">404 · Nos desviamos un poquito</div><h1 style="font-size:2rem">Esta página no está disponible.</h1><p>La mascota o el registro pudo haberse eliminado de esta sesión.</p>${link(route.startsWith('/admin')?'/admin/dashboard':'/','Volver al inicio')}</div>`}
function formatDate(d){return new Date(d+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'})}
function today(){return new Date().toLocaleDateString('en-CA')}
function navigate(r){if(location.hash==='#'+r){render();window.scrollTo(0,0)}else location.hash=r}
function applyPrefs(){const theme=store.get('refugio-theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=theme;document.documentElement.style.fontSize=({normal:16,large:18,xl:20}[store.get('refugio-text','normal')]||16)+'px'}
function bindImages(){ $$('img').forEach(im=>{im.onerror=()=>{im.classList.add('image-error');im.alt='Fotografía de '+(im.alt.split(': fotografía ilustrativa de ')[1]||'mascota')+' · Conéctate a internet para verla';};if(im.complete&&!im.naturalWidth)im.onerror()}); }
function render(focus=false){route=decodeURI(location.hash.slice(1)||'/').split('?')[0];if(route==='#main'||route==='main')route='/';const admin=route.startsWith('/admin');let content='';if(admin&&route!=='/admin/login'&&!adminLogin){navigate('/admin/login');return}if(route==='/admin/login'){$('#app').innerHTML=login(true)}else if(admin){if(route==='/admin/dashboard'||route==='/admin')content=dashboard();else if(route==='/admin/mascotas')content=adminPets();else if(route==='/admin/mascotas/nueva')content=petForm();else if(/^\/admin\/mascotas\/[^/]+\/editar$/.test(route)){let p=getPet(route.split('/')[3]);content=p?petForm(p):notFound()}else if(route==='/admin/solicitudes')content=adminRequests();else if(route.startsWith('/admin/solicitudes/'))content=requestDetail(requests.find(r=>r.id===route.split('/')[3]));else if(route==='/admin/usuarios')content=adminUsers();else if(route==='/admin/reportes')content=report();else if(route==='/admin/configuracion')content=configuration();else content=notFound();$('#app').innerHTML=adminShell(content)}else{if(route==='/')content=home();else if(route==='/mascotas')content=catalog();else if(route.startsWith('/mascotas/'))content=detail(getPet(route.split('/')[2]));else if(route==='/adopcion')content=adoption();else if(route==='/mi-solicitud')content=tracking();else if(route==='/preguntas-frecuentes')content=faq();else if(route==='/login')content=login();else if(route==='/perfil')content=profilePage();else content=notFound();$('#app').innerHTML=header()+`<main id="main" tabindex="-1">${content}</main>`+footer();if(route==='/mascotas')renderResults()}
if($('#pet-form')){['age','weight'].forEach(n=>{let el=$(`[name="${n}"]`);el.min=n==='age'?'0':'0.1';el.max=n==='age'?'40':'150';el.step='0.1'})}if($('.sidebar'))$('.sidebar').inert=innerWidth<=950&&!drawerOpen;$$('.controls a').forEach(a=>a.setAttribute('aria-label',publicLogin?'Mi perfil':'Iniciar sesión'));bindImages();document.title=($('h1')?.textContent||'Inicio')+' · Refugio Esperanza';if(focus)$('#main')?.focus({preventScroll:true});}
function toast(t){$('#toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',5000)}
function modal(title,body,actions=''){previousFocus=document.activeElement;$('#modal').innerHTML=`<div class="dialog-body"><div class="dialog-head"><h2 id="modal-title">${title}</h2>${btn(icon('close'),'close-modal','icon-btn','aria-label="Cerrar ventana"')}</div>${body}${actions?`<div class="dialog-actions">${actions}</div>`:''}</div>`;$('#modal').showModal();bindImages()}
function closeModal(){$('#modal').close();if(previousFocus?.isConnected)previousFocus.focus();else $('#main')?.focus({preventScroll:true})}
function profileFields(p){return field('name','Nombre completo',p.name)+field('email','Correo',p.email,'email')+field('phone','Teléfono',p.phone,'tel')+select('house','Tipo de vivienda',['Casa','Apartamento','Finca'],p.house)+field('city','Ciudad',p.city)+field('others','Otras mascotas',p.others,'text',false)}
function collectDraft(){let f=$('#adoption-form');if(f)Object.assign(draft,Object.fromEntries(new FormData(f)))}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el)return;let a=el.dataset.action,id=el.dataset.id;switch(a){
case 'theme':store.set('refugio-theme',document.documentElement.dataset.theme==='dark'?'light':'dark');applyPrefs();$$('[data-action="theme"]').forEach(b=>{b.innerHTML=icon(document.documentElement.dataset.theme==='dark'?'sun':'moon');b.setAttribute('aria-label','Cambiar a modo '+(document.documentElement.dataset.theme==='dark'?'claro':'oscuro'))});if($('#setting-theme'))$('#setting-theme').value=document.documentElement.dataset.theme;break;
case 'text':store.set('refugio-text',el.dataset.value);applyPrefs();$$('[data-action="text"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===el.dataset.value)));el.closest('details').open=false;el.closest('details').querySelector('summary').focus();toast('Tamaño de texto actualizado.');break;
case 'menu':menuOpen=!menuOpen;$('#public-nav').classList.toggle('open',menuOpen);el.setAttribute('aria-expanded',String(menuOpen));break;
case 'drawer':drawerOpen=!drawerOpen;render();if(drawerOpen)$('#admin-nav a')?.focus();else $('[data-action="drawer"]')?.focus();break;
case 'process':$('#proceso').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});break;
case 'clear':filters={q:'',species:'',size:'',age:'',status:'',order:'name'};catalogMode='results';clearTimeout(catalogTimer);render();$('#pet-search')?.focus({preventScroll:true});break;
case 'loading':case 'retry':catalogMode='loading';renderResults();clearTimeout(catalogTimer);catalogTimer=setTimeout(()=>{catalogMode='results';renderResults()},1400);break;
case 'error':clearTimeout(catalogTimer);catalogMode='error';renderResults();break;
case 'empty':clearTimeout(catalogTimer);filters.q='Sin coincidencias';catalogMode='results';render();break;
case 'thumbnail':{let img=$('.main-pet');img.style.objectPosition=el.dataset.pos;img.style.objectFit=el.dataset.pos==='center center'?'cover':'cover';img.style.height=el.dataset.pos==='center center'?'':'360px';$$('.thumbnails button').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));break}
case 'adopt':selectedPet=id;step=1;successId=null;draft={};navigate('/adopcion');break;
case 'previous':collectDraft();step=Math.max(1,step-1);render(true);window.scrollTo(0,0);break;
case 'new-request':successId=null;step=1;draft={};navigate('/mascotas');break;
case 'password':{let p=$('#password');p.type=p.type==='password'?'text':'password';el.setAttribute('aria-pressed',String(p.type==='text'));el.setAttribute('aria-label',p.type==='text'?'Ocultar contraseña':'Mostrar contraseña');break}
case 'recover':modal('Recupera tu acceso',`<p>Simulación: no enviaremos ningún correo.</p><form id="recover-form" style="margin-top:20px">${field('recover-email','Correo electrónico','','email')}<button class="btn full" type="submit">Simular recuperación</button></form>`);break;
case 'register':modal('Tu historia empieza aquí',`<p>Cuenta de demostración. No uses información real.</p><form id="register-form" style="margin-top:20px">${field('name','Nombre completo')}${field('email','Correo','','email')}<button class="btn full" type="submit">Crear cuenta simulada</button></form>`);break;
case 'clear-faq':$('#faq-search').value='';$('#faq-list').innerHTML=faqItems(faqs);$('#faq-count').textContent='10 preguntas';$('#faq-search').focus();break;
case 'logout':publicLogin=false;store.set('refugio-demo-session','no');navigate('/login');toast('Sesión simulada cerrada.');break;
case 'admin-logout':adminLogin=false;drawerOpen=false;navigate('/admin/login');break;
case 'edit-profile':modal('Editar mi perfil',`<form id="profile-form">${profileFields(profile)}<button type="submit" class="btn full">Guardar información</button></form>`);break;
case 'track':trackId=id;navigate('/mi-solicitud');break;
case 'cancel-request':modal('¿Cancelar tu solicitud?',`<p>La solicitud ${esc(id)} se cerrará en esta demostración. No se enviará ningún mensaje.</p>`,btn('Mantener solicitud','close-modal','btn secondary')+btn('Sí, cancelar','confirm-cancel','btn danger',`data-id="${id}"`));break;
case 'confirm-cancel':{let r=requests.find(x=>x.id===id);r.status='Finalizada';r.next='Proceso cerrado por cancelación del solicitante.';r.history.push([new Date().toLocaleDateString('es-CO'),'Cancelada por el solicitante']);closeModal();render(true);toast('Solicitud cancelada en esta sesión.');break}
case 'admin-view':{let p=getPet(id);modal(esc(p.name),`${image(p,'',false)}<p style="margin-top:16px">${esc(p.description)}</p>${summary([['Estado',p.status],['Edad',ageText(p)],['Salud',p.health]])}`);break}
case 'photos':{let p=getPet(id);modal('Fotografías de '+esc(p.name),`<p>Galería de demostración.</p><div class="photo-edit" id="modal-photos">${image(p)}</div>${btn(icon('plus')+' Agregar fotografía de ejemplo','add-demo-photo','btn secondary',`data-id="${id}"`)}<p class="small muted" style="margin-top:18px">No se cargan archivos; se añade una miniatura de ejemplo.</p>`);break}
case 'add-demo-photo':$('#modal-photos').insertAdjacentHTML('beforeend',image(getPet(id)));bindImages();toast('Miniatura de ejemplo agregada.');break;
case 'mock-photo':{let photoEl=$('#pet-form-photos img');$('#pet-form-photos').appendChild(photoEl.cloneNode(true));toast('Fotografía de ejemplo añadida; no se subió ningún archivo.');break}
case 'pet-status':{let p=getPet(id);modal('Estado de '+esc(p.name),`<form id="pet-status-form" data-id="${id}">${select('status','Estado',['Disponible','En proceso','Adoptado'],p.status)}<button class="btn full" type="submit">Actualizar estado</button></form>`);break}
case 'delete-pet':modal('¿Eliminar esta mascota?',`<p>¿Estás seguro de que deseas eliminar a <strong>${esc(petName(id))}</strong>? Desaparecerá del catálogo durante esta sesión. Las solicitudes existentes se conservarán.</p>`,btn('Conservar mascota','close-modal','btn secondary')+btn('Eliminar mascota','confirm-delete','btn danger',`data-id="${id}"`));break;
case 'confirm-delete':pets=pets.filter(p=>p.id!==id);closeModal();render(true);toast('Mascota eliminada de esta sesión.');break;
case 'view-user':{let u=users.find(u=>u.id===+id);modal('Perfil de usuario',summary([['Nombre',u.name],['Correo',u.email],['Estado',u.status],['Tipo',u.type],['Solicitudes',u.requests]]));break}
case 'edit-user':{let u=users.find(u=>u.id===+id);modal('Editar usuario',`<form id="user-form" data-id="${id}">${field('name','Nombre',u.name)}${field('email','Correo',u.email,'email')}${select('type','Tipo',['Adoptante','Administrador'],u.type)}<button class="btn full" type="submit">Guardar cambios</button></form>`);break}
case 'toggle-user':{let u=users.find(u=>u.id===+id);u.status=u.status==='Activo'?'Inactivo':'Activo';render();toast('Estado del usuario actualizado localmente.');break}
case 'close-modal':closeModal();break;
case 'social':toast('Red social simulada. No hay un perfil externo vinculado.');break;
}});
document.addEventListener('input',e=>{let t=e.target;if(t.id==='pet-search'){filters.q=t.value;catalogMode='results';renderResults()}if(t.id==='faq-search'){let q=t.value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let list=faqs.filter(x=>x.join(' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(q));$('#faq-list').innerHTML=faqItems(list);$('#faq-count').textContent=`${list.length} preguntas encontradas`;}if(t.id==='admin-search'){$('#admin-pet-table').innerHTML=petTable(pets.filter(p=>(p.name+' '+p.breed).toLowerCase().includes(t.value.toLowerCase())));bindImages()}});
document.addEventListener('change',e=>{let t=e.target;if(route==='/mascotas'&&['species','size','age','status'].includes(t.name)){filters[t.name]=t.value;catalogMode='results';renderResults()}if(t.id==='sort'){filters.order=t.value;renderResults()}if(t.id==='request-filter')$('#requests-table').innerHTML=requestTable(requests.filter(r=>!t.value||r.status===t.value));if(t.id==='setting-theme'){store.set('refugio-theme',t.value);applyPrefs();$$('[data-action="theme"]').forEach(b=>{b.innerHTML=icon(t.value==='dark'?'sun':'moon');b.setAttribute('aria-label',t.value==='dark'?'Cambiar a modo claro':'Cambiar a modo oscuro')});}});
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target;if(!f.checkValidity()){f.reportValidity();return}let d=Object.fromEntries(new FormData(f));switch(f.id){
case 'adoption-form':collectDraft();if(step<4){step++;render(true);window.scrollTo(0,0)}else{let p=getPet(selectedPet);if(!p||p.status!=='Disponible'){toast('Esta mascota ya no está disponible.');navigate('/mascotas');return}let id='RE-2026-'+String(143+requests.length-3).padStart(4,'0');let now=new Date().toISOString().slice(0,10);requests.unshift({id,pet:selectedPet,name:draft.first+' '+draft.last,email:draft.email,phone:draft.phone,city:draft.city,house:draft.house,others:draft.pets,date:now,status:'Nueva',owner:'Sin asignar',next:'Revisión inicial del formulario de prueba.',updated:now,notes:draft.motivation,history:[[formatDate(now),'Solicitud recibida (simulación)']]});successId=id;trackId=id;render(true);window.scrollTo(0,0)}break;
case 'public-login':publicLogin=true;profile.email=d.email;store.set('refugio-demo-session',d.remember?'yes':'no');navigate('/perfil');toast('Sesión de demostración iniciada.');break;
case 'admin-login':adminLogin=true;navigate('/admin/dashboard');toast('Bienvenido al panel de demostración.');break;
case 'recover-form':closeModal();toast('Recuperación simulada completada. No se ha enviado ningún correo.');break;
case 'register-form':profile.name=d.name;profile.email=d.email;publicLogin=true;closeModal();navigate('/perfil');toast('Cuenta de prueba creada en esta sesión.');break;
case 'profile-form':Object.assign(profile,d);closeModal();render(true);toast('Perfil actualizado en esta sesión.');break;
case 'pet-status-form':getPet(f.dataset.id).status=d.status;closeModal();render(true);toast('Estado de mascota actualizado.');break;
case 'pet-form':{let p=getPet(f.dataset.id);d.age=Number(d.age);d.weight=Number(d.weight);if(p)Object.assign(p,d);else{d.id='mascota-'+Date.now();d.image=photo(d.species==='Gato'?'photo-1514888286974-6c03e2ca1dba':'photo-1552053831-71594a27632d');pets.push(d)}navigate('/admin/mascotas');toast('Mascota guardada en esta sesión.');break}
case 'request-form':{let r=requests.find(x=>x.id===f.dataset.id);let old=r.status;Object.assign(r,d);r.updated=new Date().toISOString().slice(0,10);if(old!==r.status)r.history.push([formatDate(r.updated),'Estado cambiado a '+r.status]);r.next={Nueva:'Revisión inicial del formulario.', 'En revisión':'Revisión de información del hogar.',Entrevista:'Coordinar una conversación de bienvenida.','Visita al hogar':'Coordinar visita de acompañamiento.',Aprobada:'Preparar el encuentro y la entrega.',Rechazada:'Proceso cerrado. Consultar observaciones.',Finalizada:'Proceso finalizado. Seguimiento de adaptación.'}[r.status];render(true);toast('Solicitud actualizada. El seguimiento refleja el nuevo estado.');break}
case 'user-form':Object.assign(users.find(u=>u.id===+f.dataset.id),d);closeModal();render(true);toast('Usuario actualizado en esta sesión.');break;
case 'settings-form':settings={...d,notifications:!!d.notifications};toast('Configuración guardada en esta sesión.');break;
}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(drawerOpen){drawerOpen=false;render();$('[data-action="drawer"]')?.focus()}if(menuOpen){menuOpen=false;$('#public-nav')?.classList.remove('open');$('[data-action="menu"]')?.setAttribute('aria-expanded','false')}$$('.access[open]').forEach(d=>d.open=false)}if(drawerOpen&&e.key==='Tab'){let navs=$$('.sidebar a,.sidebar button');let first=navs[0],last=navs.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();$('#main')?.focus();$('#main')?.scrollIntoView()});
window.addEventListener('resize',()=>{if($('.sidebar'))$('.sidebar').inert=innerWidth<=950&&!drawerOpen});
window.addEventListener('hashchange',()=>{menuOpen=false;drawerOpen=false;if($('#modal').open)closeModal();render(true);window.scrollTo(0,0)});
applyPrefs();render();
</script>
</body></html>
